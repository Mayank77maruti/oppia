name: Sync Open PR Branches

on:
  push:
    branches:
      - develop

jobs:
  sync-pr-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Octokit
        run: npm install @octokit/rest

      - name: Sync PR Branches
        run: |
          const { Octokit } = require('@octokit/rest');
          const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });

          async function syncPRBranches() {
            try {
              // Fetch open PRs
              const { data: prs } = await octokit.pulls.list({
                owner: 'Fgrdxgu',
                repo: 'oppia',
                state: 'open',
              });

              for (const pr of prs) {
                const prBranch = pr.head.ref;
                console.log(`Syncing PR branch: ${prBranch}`);

                // Fetch the latest develop branch
                await octokit.git.updateRef({
                  owner: 'Fgrdxgu',
                  repo: 'oppia',
                  ref: `heads/${prBranch}`,
                  sha: pr.base.sha,
                });

                // Merge develop into the PR branch
                await octokit.pulls.merge({
                  owner: 'Fgrdxgu',
                  repo: 'oppia',
                  pull_number: pr.number,
                  commit_title: 'Sync with develop',
                  commit_message: 'Merged the latest changes from develop into this PR branch.',
                  merge_method: 'merge',
                });
              }
            } catch (error) {
              console.error('Error syncing PR branches:', error);
              process.exit(1);
            }
          }

          syncPRBranches();
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
