name: Sync Open PR Branches

on:
  push:
    branches:
      - develop

jobs:
  sync-pr-branches:
    runs-on: ubuntu-latest
    name: Sync Open PR Branches with 'develop'
    strategy:
      matrix:
        branch: ${{ steps.list-prs.outputs.branches }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Open Pull Requests
        id: list-prs
        run: |
          echo "branches=$(gh pr list --state open --json headRefName --jq '.[].headRefName' | tr '\n' ',')"
          echo "::set-output name=branches::${branches}"

      - name: Sync Branch with 'develop'
        uses: tretuna/sync-branches@1.4.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_BRANCH: develop
          TO_BRANCH: ${{ matrix.branch }}
