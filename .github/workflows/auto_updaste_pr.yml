name: Sync Open PR Branches with Develop

on:
  push:
    branches:
      - develop

jobs:
  sync-pr-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install GitHub CLI
        run: |
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-key C99B11DEB97541F0
          sudo apt-add-repository https://cli.github.com/packages
          sudo apt update
          sudo apt install gh

      - name: Authenticate GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: List Open PR Branches
        id: list_prs
        run: |
          gh pr list --state open --json headRefName --jq '.[].headRefName' > pr_branches.txt
          echo "::set-output name=pr_branches::$(cat pr_branches.txt)"

      - name: Sync PR Branches with Develop
        if: steps.list_prs.outputs.pr_branches != ''
        run: |
          while read branch; do
            echo "Syncing branch: $branch"
            git fetch origin $branch
            git checkout $branch
            git merge origin/develop
            git push origin $branch
          done < pr_branches.txt
