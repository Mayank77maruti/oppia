name: Secure Workflow

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read  # Default read-only permissions for all jobs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run build
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grant write access specifically for deployment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to production
        run: ./deploy.sh
