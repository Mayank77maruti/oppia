name: Assign Author on Conflict

on:
  push:
    branches:
      - develop

jobs:
  list-prs:
    runs-on: ubuntu-latest
    outputs:
      pr-list: ${{ steps.set-pr-list.outputs.pr-list }}
    steps:
      - name: List Open PRs
        id: list_prs
        run: |
          PRS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open")
          echo "Open PRs: $PRS"
          echo "prs=$PRS" >> $GITHUB_OUTPUT

      - name: Set PR List Output
        id: set-pr-list
        run: |
          echo "pr-list=${{ steps.list_prs.outputs.prs }}" >> $GITHUB_OUTPUT

  check-conflicts:
    runs-on: ubuntu-latest
    needs: list-prs
    steps:
      - name: Get PR List
        id: get-pr-list
        run: |
          echo "pr-list=${{ needs.list-prs.outputs.pr-list }}" >> $GITHUB_OUTPUT

      - name: Check for Conflicts and Assign Author
        id: check-conflicts
        run: |
          PR_LIST='${{ steps.get-pr-list.outputs.pr-list }}'

          for pr in $(echo "$PR_LIST" | jq -r '.[] | @base64'); do
            PR=$(echo "$pr" | base64 --decode)
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_AUTHOR=$(echo "$PR" | jq -r '.user.login')

            # Check if PR has conflicts
            PR_DETAILS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")
            MERGEABLE_STATE=$(echo "$PR_DETAILS" | jq -r '.mergeable_state')

            if [ "$MERGEABLE_STATE" = "conflict" ]; then
              echo "PR #$PR_NUMBER has conflicts. Assigning to $PR_AUTHOR."

              # Assign author to PR
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/assignees" \
                -d '{"assignees":["'"$PR_AUTHOR"'"]}'
            else
              echo "PR #$PR_NUMBER does not have conflicts."
            fi
          done
