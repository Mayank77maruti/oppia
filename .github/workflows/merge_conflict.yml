name: Assign Author on Conflict

on:
  push:
    branches:
      - develop

jobs:
  list-prs:
    runs-on: ubuntu-latest
    outputs:
      pr-list: ${{ steps.set-pr-list.outputs.pr-list }}
    steps:
      - name: List Open PRs
        id: list_prs
        run: |
          PRS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open")
          echo "Open PRs: $PRS"
          echo "::set-output name=prs::$PRS"

      - name: Set PR List Output
        id: set-pr-list
        run: |
          echo "::set-output name=pr-list::${{ steps.list_prs.outputs.prs }}"

  check-conflicts:
    runs-on: ubuntu-latest
    needs: list-prs
    outputs:
      conflicting-prs: ${{ steps.set-conflicting-prs.outputs.conflicting-prs }}
    steps:
      - name: Get PR List
        id: get-pr-list
        run: |
          echo "::set-output name=pr-list::${{ needs.list-prs.outputs.pr-list }}"

      - name: Check for Conflicts
        id: check-conflicts
        run: |
          PR_LIST='${{ steps.get-pr-list.outputs.pr-list }}'
          CONFLICTING_PRS=()

          for pr in $(echo "$PR_LIST" | jq -r '.[] | @base64'); do
            PR=$(echo "$pr" | base64 --decode)
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_DETAILS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")
            MERGEABLE_STATE=$(echo "$PR_DETAILS" | jq -r '.mergeable_state')

            if [ "$MERGEABLE_STATE" = "conflict" ]; then
              CONFLICTING_PRS+=("$PR_DETAILS")
            fi
          done

          echo "Conflicting PRs: ${CONFLICTING_PRS[@]}"
          echo "::set-output name=conflicting-prs::$(echo ${CONFLICTING_PRS[@]} | jq -s '.')"

      - name: Debug Conflicting PRs
        run: |
          echo "Conflicting PRs Output: ${{ steps.check-conflicts.outputs.conflicting-prs }}"

      - name: Set Conflicting PRs Output
        id: set-conflicting-prs
        run: |
          echo "::set-output name=conflicting-prs::${{ steps.check-conflicts.outputs.conflicting-prs }}"

  assign-author:
    runs-on: ubuntu-latest
    needs: check-conflicts
    if: ${{ fromJson(needs.check-conflicts.outputs.conflicting-prs).length > 0 }}
    steps:
      - name: Debug Conflicting PRs
        run: |
          echo "Conflicting PRs: ${{ needs.check-conflicts.outputs.conflicting-prs }}"
          echo "Number of Conflicting PRs: ${{ fromJson(needs.check-conflicts.outputs.conflicting-prs).length }}"

      - name: Get Conflicting PRs
        id: get-conflicting-prs
        run: |
          echo "::set-output name=conflicting-prs::${{ needs.check-conflicts.outputs.conflicting-prs }}"

      - name: Assign Author to PR
        uses: technote-space/assign-author@v1.6.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr: ${{ fromJson(steps.get-conflicting-prs.outputs.conflicting-prs)[0].number }}
