name: Handle PR Conflicts

on:
  push:
    branches:
      - develop

jobs:
  list_open_prs:
    name: List Open PRs and Check for Conflicts
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Open Pull Requests
        id: fetch_prs
        run: |
          PRS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/Fgrdxgu/oppia/pulls?state=open")
          echo "Open PRs: $PRS"
          echo "::set-output name=prs::$PRS"

      - name: Check Merge Conflicts
        id: check_conflicts
        run: |
          PRS=${{ steps.fetch_prs.outputs.prs }}
          echo "${PRS}" | jq -c '.[]' | while read pr; do
            PR_NUMBER=$(echo "$pr" | jq -r '.number')
            PR_AUTHOR=$(echo "$pr" | jq -r '.user.login')
            CONFLICTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/Fgrdxgu/oppia/pulls/$PR_NUMBER/merge" \
              | jq -r '.message')

            if [ "$CONFLICTS" == "Merge conflict" ]; then
              echo "PR #$PR_NUMBER has conflicts. Assigning to $PR_AUTHOR."
              echo "conflicting_prs::$PR_NUMBER,$PR_AUTHOR" >> conflicts_list.txt
            else
              echo "PR #$PR_NUMBER has no conflicts."
            fi
          done
          
      - name: Output Conflict PRs
        id: output_conflicts
        run: |
          if [ -f conflicts_list.txt ]; then
            cat conflicts_list.txt
          else
            echo "No PRs with conflicts."
          fi

  assign_author:
    name: Assign Author to PRs with Conflicts
    runs-on: ubuntu-latest
    needs: list_open_prs
    steps:
      - name: Read Conflicting PRs
        id: read_conflicts
        run: |
          if [ -f conflicts_list.txt ]; then
            cat conflicts_list.txt
          else
            echo "No conflicting PRs found." && exit 0
          fi

      - name: Assign Author to PRs
        if: always()
        uses: technote-space/assign-author@v1.6.2
        with:
          pr_numbers: ${{ steps.read_conflicts.outputs.conflicting_prs }}
          token: ${{ secrets.GITHUB_TOKEN }}
