name: Auto Label Conflicts

on:
  push:
    branches: [develop] # Trigger on pushes to the `develop` branch
  pull_request_target:
    types: [synchronize] # Trigger when the PR branch is updated

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        id: set-env
        run: |
          echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV
          echo "REPO=${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo "OWNER=${{ github.event.repository.owner.login }}" >> $GITHUB_ENV
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Add merge conflict label
        uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: "PR: don't merge - HAS MERGE CONFLICTS" # Label to add when conflicts exist
          repoToken: "${{ secrets.GITHUB_TOKEN }}" # GitHub token for authentication
          removeOnDirtyLabel: "" # Optional: Leave this blank as no label is removed

      - name: Install curl
        run: sudo apt-get install curl

      - name: Check for merge conflicts and assign PR to author (using JS)
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const prNumber = process.env.PR_NUMBER;
            const author = process.env.AUTHOR;

            // Check if the PR has merge conflicts by using the GitHub API
            const prDetails = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            if (prDetails.data.mergeable === false) {
              // Add a comment if there are merge conflicts
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `Hi @${author}. Due to recent changes in the "develop" branch, this PR now has a merge conflict. Please follow [this link](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts/resolving-a-merge-conflict-using-the-command-line) to resolve it. Thanks!`
              });

              // Assign the PR to the author
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: prNumber,
                assignees: [author]
              });
            } else {
              console.log("No merge conflicts detected.");
            }
