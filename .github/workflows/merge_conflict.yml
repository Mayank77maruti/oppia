name: Auto Label Conflicts

on:
  push:
    branches: [develop]  # Trigger on pushes to the `develop` branch
  pull_request_target:
    types: [synchronize]  # Trigger when the PR branch is updated

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        if: ${{ github.event.pull_request }}
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.event.repository.owner.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "AUTHOR=${AUTHOR}" >> $GITHUB_ENV
          echo "REPO=${REPO}" >> $GITHUB_ENV
          echo "OWNER=${OWNER}" >> $GITHUB_ENV
          echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_ENV

      - name: Check if PRs have merge conflicts
        id: label_conflicts
        uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: "PR: don't merge - HAS MERGE CONFLICTS"  # Label to add when conflicts exist
          repoToken: "${{ secrets.GITHUB_TOKEN }}"  # GitHub token for authentication
          removeOnDirtyLabel: ""  # Optional: Label to remove when conflicts exist
          commentOnDirty: |  # Custom comment when conflicts are detected
            Hi @${{ env.AUTHOR }}. Due to recent changes in the "develop" branch, this PR now has a merge conflict. 
            Please follow [this link](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts/resolving-a-merge-conflict-using-the-command-line) if you need help resolving the conflict, so that the PR can be merged. 
            Thanks!
          commentOnClean: ""  # Optional: Comment when conflicts are resolved

      - name: Assign PR to author if conflicts exist
        if: steps.label_conflicts.outputs.has_conflicts == 'true' && env.AUTHOR && env.PR_NUMBER
        run: |
          echo "Assigning PR #${{ env.PR_NUMBER }} to author @${{ env.AUTHOR }} due to merge conflicts."
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"assignees": ["${{ env.AUTHOR }}"]}' \
            "https://api.github.com/repos/${{ env.OWNER }}/${{ env.REPO }}/issues/${{ env.PR_NUMBER }}/assignees"

      - name: Log completion
        run: echo "Workflow completed."
