name: Assign Author on Conflict

on:
  push:
    branches:
      - develop

jobs:
  list-prs:
    runs-on: ubuntu-latest
    outputs:
      pr-list: ${{ steps.set-pr-list.outputs.pr-list }}
    steps:
      - name: List Open PRs
        id: list-prs
        run: |
          PRS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open")
          echo "Open PRs: $PRS"
          echo "prs=$PRS" >> $GITHUB_ENV

      - name: Set PR List Output
        id: set-pr-list
        run: echo "::set-output name=pr-list::${{ env.prs }}"

  check-conflicts:
    runs-on: ubuntu-latest
    needs: list-prs
    outputs:
      conflicting-prs: ${{ steps.set-conflicting-prs.outputs.conflicting-prs }}
    steps:
      - name: Parse PR List
        id: parse-pr-list
        run: |
          echo "${{ needs.list-prs.outputs.pr-list }}" > prs.json

      - name: Check for Conflicts
        uses: actions/github-script@v6
        id: check-conflicts
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = require('./prs.json');
            const conflictingPRs = [];
            for (const pr of prs) {
              const prDetails = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              if (prDetails.data.mergeable_state === 'conflict') {
                conflictingPRs.push({ number: pr.number, user: pr.user.login });
              }
            }
            return JSON.stringify(conflictingPRs);

      - name: Set Conflicting PRs Output
        id: set-conflicting-prs
        run: echo "::set-output name=conflicting-prs::${{ steps.check-conflicts.outputs.result }}"

  assign-author:
    runs-on: ubuntu-latest
    needs: check-conflicts
    if: ${{ needs.check-conflicts.outputs.conflicting-prs != '[]' }}
    steps:
      - name: Parse Conflicting PRs
        id: parse-conflicting-prs
        run: |
          echo "${{ needs.check-conflicts.outputs.conflicting-prs }}" > conflicting_prs.json

      - name: Assign Author to PRs
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conflictingPRs = require('./conflicting_prs.json');
            for (const pr of conflictingPRs) {
              console.log(`Assigning PR #${pr.number} to ${pr.user}.`);
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [pr.user],
              });
            }
