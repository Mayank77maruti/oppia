name: Auto Label Conflicts

on:
  push:
    branches: [develop]  # Trigger on pushes to the `develop` branch
  pull_request:
    types: [synchronize]  # Trigger when the PR branch is updated

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get the associated pull request
        id: pr-details
        run: |
          # Fetch the PR associated with the commit on develop branch
          pr_info=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?base=develop&head=${{ github.actor }}:develop")
          
          # Check if the PR exists and extract PR number and author
          PR_NUMBER=$(echo "$pr_info" | jq '.[0].number')
          AUTHOR=$(echo "$pr_info" | jq '.[0].user.login' | tr -d '"')

          # Ensure we found a PR
          if [ -z "$PR_NUMBER" ]; then
            echo "No associated PR found for the commit to develop."
            exit 1
          fi

          # Set environment variables for further steps
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "AUTHOR=$AUTHOR" >> $GITHUB_ENV

      - name: Check if PR has merge conflicts
        uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: "PR: don't merge - HAS MERGE CONFLICTS"  # Label to add when conflicts exist
          repoToken: "${{ secrets.GITHUB_TOKEN }}"  # GitHub token for authentication
          removeOnDirtyLabel: ""  # Optional: Leave this blank as no label is removed
          commentOnDirty: |
            Hi @${{ env.AUTHOR }}. Due to recent changes in the "develop" branch, this PR now has a merge conflict.
            Please follow [this link](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts/resolving-a-merge-conflict-using-the-command-line) if you need help resolving the conflict, so that the PR can be merged.
            Thanks!

      - name: Install curl
        run: sudo apt-get install curl

      - name: Assign PR to the author
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"assignees":["${{ env.AUTHOR }}"]}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/assignees"
