name: Auto Label Conflicts

on:
  push:
    branches: [develop] # Trigger on pushes to the `develop` branch
  pull_request_target:
    types: [synchronize] # Trigger when the PR branch is updated

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        id: set-env
        run: |
          echo "REPO=${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo "OWNER=${{ github.event.repository.owner.login }}" >> $GITHUB_ENV

      - name: Add merge conflict label
        uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: "PR: don't merge - HAS MERGE CONFLICTS" # Label to add when conflicts exist
          repoToken: "${{ secrets.GITHUB_TOKEN }}" # GitHub token for authentication
          removeOnDirtyLabel: "" # Optional: Leave this blank as no label is removed

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: List PRs with merge conflicts
        id: list-prs
        run: |
          PAGE=1
          PER_PAGE=100
          PRS_WITH_CONFLICTS=""
          while true; do
            RESPONSE=$(curl -s -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${OWNER}/${REPO}/pulls?state=open&label=PR:%20don%27t%20merge%20-%20HAS%20MERGE%20CONFLICTS&page=$PAGE&per_page=$PER_PAGE")
            PRS=$(echo $RESPONSE | jq -r '.[] | "\(.number) \(.user.login)"')
            if [ -z "$PRS" ]; then
              break
            fi
            PRS_WITH_CONFLICTS="${PRS_WITH_CONFLICTS} ${PRS}"
            PAGE=$((PAGE+1))
          done
          echo "PRS_WITH_CONFLICTS=${PRS_WITH_CONFLICTS}" >> $GITHUB_ENV

      - name: Assign PRs to authors
        run: |
          for pr in $PRS_WITH_CONFLICTS; do
            PR_NUMBER=$(echo $pr | cut -d' ' -f1)
            AUTHOR=$(echo $pr | cut -d' ' -f2)
            curl -s -X PATCH -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -d "{\"assignees\": [\"$AUTHOR\"]}" "https://api.github.com/repos/${OWNER}/${REPO}/pulls/$PR_NUMBER"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS_WITH_CONFLICTS: ${{ env.PRS_WITH_CONFLICTS }}
