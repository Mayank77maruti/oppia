name: Auto Label Conflicts

on:
  push:
    branches: [develop]  # Trigger on pushes to the `develop` branch
  pull_request_target:
    types: [synchronize]  # Trigger when the PR branch is updated

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PRs have merge conflicts
        uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: "PR: don't merge - HAS MERGE CONFLICTS"  # Label to add when conflicts exist
          repoToken: "${{ secrets.GITHUB_TOKEN }}"  # GitHub token for authentication
          removeOnDirtyLabel: ""  # Optional: Label to remove when conflicts exist
          commentOnDirty: |  # Custom comment when conflicts are detected
            :wave: Hi, @${author}!
            Due to recent changes in the `develop` branch, this PR now has a merge conflict. 
            Please sync your branch with the `develop` branch to resolve the conflict. 
            If you need help, you can follow [this guide](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts/resolving-a-merge-conflict-on-github).
            Thanks! :pray:
          commentOnClean: ""  # Optional: Comment when conflicts are resolved
