name: Auto Label Conflicts

on:
  push:
    branches: [develop]  # Trigger on pushes to the `develop` branch
  pull_request_target:
    types: [synchronize]  # Trigger when the PR branch is updated

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        id: set-env
        run: |
          echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV
          echo "REPO=${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo "OWNER=${{ github.event.repository.owner.login }}" >> $GITHUB_ENV
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Check if PRs have merge conflicts
        uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: "PR: don't merge - HAS MERGE CONFLICTS"  # Label to add when conflicts exist
          repoToken: "${{ secrets.GITHUB_TOKEN }}"  # GitHub token for authentication
          removeOnDirtyLabel: ""  # Optional: Leave this blank as no label is removed
          commentOnDirty: |
            Hi @${{ github.event.pull_request.user.login }}. Due to recent changes in the "develop" branch, this PR now has a merge conflict.
            Please follow [this link](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts/resolving-a-merge-conflict-using-the-command-line) if you need help resolving the conflict, so that the PR can be merged.
            Thanks!

  additional-check:
    runs-on: ubuntu-latest
    needs: main
    steps:
      - name: Fetch PRs with conflict label
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelToCheck = 'PR: don\'t merge - HAS MERGE CONFLICTS';  // The conflict label
            const repo = {
              owner: "${{ github.repository_owner }}",
              repo: "${{ github.event.repository.name }}",
            };
            
            const getPRs = async () => {
              let page = 1;
              let prs = [];
              while (true) {
                const response = await github.rest.pulls.list({
                  owner: repo.owner,
                  repo: repo.repo,
                  state: 'open',  // Only open PRs
                  labels: labelToCheck,  // Filter PRs with the conflict label
                  per_page: 100,
                  page: page,
                });
                if (response.data.length === 0) break;
                prs = prs.concat(response.data);
                page++;
              }
              return prs;
            };

            const prs = await getPRs();

            // Output PR numbers for logging
            console.log(`Found ${prs.length} PRs with the conflict label:`);
            prs.forEach(pr => console.log(`#${pr.number} - ${pr.title}`));

            // Write PR numbers to a file for later steps if needed
            const prNumbers = prs.map(pr => pr.number);
            fs.writeFileSync('prs-to-process.txt', prNumbers.join('\n'));

      - name: Read PR numbers
        run: |
          echo "PRs to process:"
          cat prs-to-process.txt

      - name: Assign PR authors
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumbers = fs.readFileSync('prs-to-process.txt', 'utf8').split('\n').filter(n => n);

            for (const prNumber of prNumbers) {
              // Fetch the PR details
              const pr = await github.rest.pulls.get({
                owner: "${{ github.repository_owner }}",
                repo: "${{ github.event.repository.name }}",
                pull_number: prNumber,
              });

              // Assign the PR author to the PR
              await github.rest.issues.addAssignees({
                owner: "${{ github.repository_owner }}",
                repo: "${{ github.event.repository.name }}",
                issue_number: prNumber,
                assignees: [pr.data.user.login],
              });

              // Optionally, add a comment to notify the author
              await github.rest.issues.createComment({
                owner: "${{ github.repository_owner }}",
                repo: "${{ github.event.repository.name }}",
                issue_number: prNumber,
                body: `Hi @${pr.data.user.login}, your PR has a merge conflict. Please resolve it.`
              });
            }
