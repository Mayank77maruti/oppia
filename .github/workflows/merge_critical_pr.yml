name: Notify or Auto-Sync Critical PRs

on:
  pull_request_target:
    types:
      - merged  # Trigger when the PR is merged or closed

jobs:
  notify_or_sync:
    if: github.event.pull_request.merged == true  # Run only if the PR is merged
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Fetch PR metadata
      - name: Check for Critical Label
        id: fetch_pr
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map(label => label.name);
            const isCritical = labels.includes("PR: require post-merge sync to HEAD");
            core.setOutput("is_critical", isCritical);
            core.setOutput("pr_author", pr.user.login);
            core.setOutput("pr_number", pr.number);

      # Step 3: Notify or Sync
      - name: Notify PR Author
        if: steps.fetch_pr.outputs.is_critical == 'true'
        run: |
          echo "Notifying PR author about required sync..."
          gh pr comment ${{ steps.fetch_pr.outputs.pr_number }} --body "Your PR is critical and requires syncing with HEAD. Please sync your branch using the following commands:"

      # Step 4 (Optional): Auto-Sync Branch
      - name: Auto-Sync Critical Branch
        if: steps.fetch_pr.outputs.is_critical == 'true'
        run: |
          echo "Auto-syncing critical branch..."
          git fetch origin develop
          git checkout ${{ github.event.pull_request.head.ref }}
          git merge develop
          git push origin ${{ github.event.pull_request.head.ref }}
