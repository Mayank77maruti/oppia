name: Sync PR Branches

on:
  pull_request:
    types:
      - closed

jobs:
  sync-pr-branches:
    if: >
        ${{ 
         github.event.pull_request.merged == true && 
         contains(join(',', github.event.pull_request.labels.*.name), 'PR: require post-merge sync') 
        }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch all open PR branches
        id: fetch-pr-branches
        run: |
          PR_BRANCHES=$(gh pr list --state open --json headRefName --jq '.[].headRefName' | jq -r '.[]')
          echo "BRANCH_LIST=$PR_BRANCHES" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-each-branch:
    needs: sync-pr-branches
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ env.BRANCH_LIST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Sync branch with develop
        uses: connor-baer/action-sync-branch@main
        with:
          branch: ${{ matrix.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
